              step: fin
              actions:
                  - what: setMusthaveFilter
                    predefined: { Lt: [1,49] }
            - label: 'Аквапарк и водные горки'
              step: fin
              actions:
                  - what: setMusthaveFilter
                    predefined: { Hf: [8] }
            - label: 'Отель только для взрослых'
              step: fin
              actions:
                  - what: setMusthaveFilter
                    predefined: { Lt: [25] }
            - label: 'Балкон или терраса'
              step: fin
              actions:
                  - what: setMusthaveFilter
                    predefined: { Rf: [14] }
            - label: 'Дискотека'
